<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-admin}">
<head>
    <meta charset="UTF-8">
    <title>Quản lý danh mục</title>
    <style>
        :root {
            --ink: #1c1c1c; --muted: #6b6b6b; --border: #dcdcdc;
            --surface: #ffffff; --accent: #2f5d50; --accent-dark: #24463c;
            --danger: #a13d3d; --info: #3d6a8a;
        }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f6f6f4; color: var(--ink); }
        .page-wrap { width: 100%; max-width: none; margin: 0; padding: 48px 56px 72px; box-sizing: border-box; }
        .topbar { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 1px solid var(--border); padding-bottom: 18px; margin-bottom: 26px; }
        .topbar h1 { font-size: 32px; font-weight: 600; margin: 0; }
        .topbar p { color: var(--muted); font-size: 17px; margin: 4px 0 0; }
        .btn-add { background: var(--accent); color: #fff; font-weight: 500; border: none; border-radius: 4px; padding: 14px 28px; font-size: 19px; display: inline-block; margin-bottom: 22px; text-decoration: none; }
        .btn-add:hover { background: var(--accent-dark); color: #fff; text-decoration: none; }
        table { margin-bottom: 0; background: var(--surface); width: 100%; border-collapse: collapse; }
        thead th { background: transparent; color: var(--muted); border-bottom: 1px solid var(--border); font-weight: 600; font-size: 17px; padding: 18px 20px; text-align: left; }
        tbody td { border-top: 1px solid #eee; vertical-align: middle; padding: 20px 18px; font-size: 18px; }
        img[alt="Icon"] { border-radius: 2px; border: 1px solid var(--border); object-fit: cover; }
        .cate-name { font-weight: 500; color: var(--ink); }
        .btn-sm { border-radius: 4px; font-weight: 500; padding: 9px 18px; border: 1px solid transparent; font-size: 17px; text-decoration: none; display: inline-block; }
        .btn-info { background: transparent; color: var(--info); border-color: var(--info); }
        .btn-info:hover { background: var(--info); color: #fff; }
        .btn-primary { background: transparent; color: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background: var(--accent); color: #fff; }
        .btn-danger { background: transparent; color: var(--danger); border-color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: #fff; }
        .empty-row { padding: 30px; color: var(--muted); }
        .pagination-bar { display: flex; justify-content: center; gap: 8px; margin-top: 26px; }
        .pagination-bar .page-link { display: inline-block; min-width: 40px; text-align: center; padding: 9px 14px; border: 1px solid var(--border); border-radius: 4px; color: var(--ink); font-size: 16px; text-decoration: none; background: var(--surface); }
        .pagination-bar .page-link:hover { background: #f2f2f2; text-decoration: none; }
        .pagination-bar .page-link.active { background: var(--accent); border-color: var(--accent); color: #fff; }
        .search-bar { display: flex; gap: 10px; margin-bottom: 22px; align-items: center; flex-wrap: wrap; }
        .search-bar input[type="text"] { flex: 1; min-width: 220px; padding: 12px 16px; font-size: 17px; border: 1px solid var(--border); border-radius: 4px; color: var(--ink); background: var(--surface); }
        .search-bar input[type="text"]:focus { outline: none; border-color: var(--accent); }
        .btn-search { background: var(--accent); color: #fff; font-weight: 500; border: none; border-radius: 4px; padding: 12px 24px; font-size: 17px; cursor: pointer; }
        .btn-search:hover { background: var(--accent-dark); }
        .btn-clear-search { color: var(--muted); font-size: 16px; text-decoration: none; padding: 12px 6px; white-space: nowrap; }
        .btn-clear-search:hover { color: var(--ink); text-decoration: underline; }
    </style>
</head>
<body>
<div layout:fragment="content">

    <div class="page-wrap">

        <div class="topbar">
            <div>
                <h1>Quản lý danh mục</h1>
                <p>Danh sách các danh mục sản phẩm hiện có trong hệ thống</p>
            </div>
        </div>

        <div th:if="${message}" style="color:#2f5d50; margin-bottom:16px;" th:text="${message}"></div>

        <a th:href="@{/admin/categories/add}" class="btn-add">Thêm danh mục mới</a>

        <form th:action="@{/admin/categories/searchpaginated}" method="get" class="search-bar">
            <input type="hidden" name="size" th:value="${pageSize}"/>
            <input type="text" name="name" th:value="${name}" placeholder="Tìm kiếm theo tên danh mục..."/>
            <button type="submit" class="btn-search">Tìm kiếm</button>
            <a th:if="${name != null and !name.isEmpty()}"
               th:href="@{/admin/categories/searchpaginated(size=${pageSize})}"
               class="btn-clear-search">Xóa tìm kiếm</a>
        </form>

        <table>
            <thead>
                <tr>
                    <th>STT</th>
                    <th>Hình ảnh</th>
                    <th>Tên danh mục</th>
                    <th>Thao tác ảnh</th>
                    <th>Hành động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cate, stt : ${categoryPage.content}">
                    <td th:text="${stt.index + 1}"></td>
                    <td>
                        <img height="80" width="110" alt="Icon"
                             th:src="@{/image(fname=${cate.images})}"
                             onerror="this.src='https://placehold.co/80x60?text=No+Image'"/>
                    </td>
                    <td class="cate-name" th:text="${cate.name}"></td>
                    <td>
                        <a th:href="@{/image(fname=${cate.images})}" target="_blank" class="btn-sm btn-info">Xem/Tải ảnh</a>
                    </td>
                    <td>
                        <a th:href="@{/admin/categories/edit/{id}(id=${cate.categoryId})}" class="btn-sm btn-primary">Sửa</a>
                        <a th:href="@{/admin/categories/delete/{id}(id=${cate.categoryId})}" class="btn-sm btn-danger"
                           onclick="return confirm('Bạn có chắc chắn muốn xóa không?');">Xóa</a>
                    </td>
                </tr>

                <tr th:if="${categoryPage.content.isEmpty()}">
                    <td colspan="5" class="empty-row" style="text-align:center;">Không có danh mục nào.</td>
                </tr>
            </tbody>
        </table>

        <div class="pagination-bar" th:if="${categoryPage.totalPages > 1}">

            <a th:if="${currentPage > 1}"
               th:href="@{/admin/categories/searchpaginated(page=${currentPage - 1}, size=${pageSize}, name=${name})}"
               class="page-link">&laquo; Trước</a>

            <a th:each="p : ${#numbers.sequence(1, categoryPage.totalPages)}"
               th:href="@{/admin/categories/searchpaginated(page=${p}, size=${pageSize}, name=${name})}"
               th:classappend="${p == currentPage} ? ' active'"
               th:text="${p}"
               class="page-link"></a>

            <a th:if="${currentPage < categoryPage.totalPages}"
               th:href="@{/admin/categories/searchpaginated(page=${currentPage + 1}, size=${pageSize}, name=${name})}"
               class="page-link">Sau &raquo;</a>

        </div>

    </div>

</div>
</body>
</html>
